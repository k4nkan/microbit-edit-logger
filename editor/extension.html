<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MakeCode Edit Logger</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #667085;
        --line: #d8dee9;
        --primary: #4051b5;
        --primary-dark: #2f3f99;
        --danger: #b42318;
        --ok: #027a48;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar,
      .summary,
      .log,
      .export-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        min-height: 34px;
        padding: 6px 10px;
      }

      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      button.primary:hover {
        background: var(--primary-dark);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      button.danger {
        color: var(--danger);
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }

      .experiment {
        text-align: right;
      }

      input[type="number"] {
        width: 72px;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        font: inherit;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      .metric {
        background: #fff;
        padding: 12px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .metric strong {
        font-size: 20px;
      }

      .log {
        overflow-x: auto;
      }

      .export-panel {
        margin-top: 12px;
        padding: 12px;
      }

      .export-panel[hidden] {
        display: none;
      }

      .export-panel-header,
      .export-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .export-panel p {
        color: var(--muted);
        margin: 8px 0;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        padding: 10px;
      }

      table {
        width: 100%;
        min-width: 1080px;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #eef2ff;
        color: #30374f;
        font-size: 12px;
        font-weight: 700;
      }

      td {
        font-size: 13px;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .ok {
        color: var(--ok);
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 720px) {
        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Edit Logger</h1>
          <div id="status" class="status">initializing</div>
        </div>
        <div class="experiment">
          <div id="experimentStatus" class="status">実験サーバー確認中</div>
          <div id="syncStatus" class="status"></div>
        </div>
      </header>

      <section class="toolbar" aria-label="controls">
        <button id="start" class="primary" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="exportJson" type="button">Export JSON</button>
        <button id="exportCsv" type="button">Export CSV</button>
        <button id="clear" class="danger" type="button">Clear</button>
      </section>

      <section class="summary" aria-label="summary">
        <div class="metric">
          <span>Events</span><strong id="count">0</strong>
        </div>
        <div class="metric">
          <span>Block Types</span><strong id="types">0</strong>
        </div>
        <div class="metric">
          <span>Blocks</span><strong id="blocks">0</strong>
        </div>
        <div class="metric">
          <span>Last Change</span><strong id="lastChange">-</strong>
        </div>
      </section>

      <section class="toolbar" aria-label="view toggle">
        <button id="viewCode" class="primary" type="button">Block Log</button>
        <button id="viewSensor" type="button">Sensor Log</button>
      </section>

      <section class="log" aria-label="edit events">
        <table>
          <thead id="tableHead">
            <tr>
              <th>Time</th>
              <th>Event</th>
              <th>Blocks</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty">No events yet.</div>
      </section>

      <section id="exportPanel" class="export-panel" aria-label="export" hidden>
        <div class="export-panel-header">
          <strong id="exportTitle">Export</strong>
          <button id="closeExport" type="button">Close</button>
        </div>
        <p>
          Download may be blocked by the MakeCode iframe sandbox. Copy the
          content below if the file does not download.
        </p>
        <textarea id="exportOutput" readonly spellcheck="false"></textarea>
        <div class="export-actions">
          <span id="exportInfo" class="status">export ready</span>
          <button id="copyExport" type="button">Copy</button>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "makecode-edit-logger:events";
      const OUTBOX_KEY = "makecode-edit-logger:unsent-event-ids";
      const LOCAL_API_URL = "http://localhost:8000";
      const EXPERIMENT_POLL_MS = 5000;
      const SYNC_BATCH_SIZE = 100;
      const SYNC_CODE_DELAY_MS = 500;
      const SYNC_SENSOR_DELAY_MS = 5000;
      const STORAGE_SAVE_DELAY_MS = 2000;
      // Sensor samples are kept only while the board is being handled;
      // a resting board leaves one heartbeat sample per interval.
      const SENSOR_MOVE_THRESHOLD_MG = 100;
      const SENSOR_HEARTBEAT_MS = 10000;
      // Flashing over WebUSB restarts the board twice within a few hundred ms.
      const BOOT_MERGE_WINDOW_MS = 1500;
      const WATCH_INTERVAL_MS = 2000;
      const SENSOR_LINE_PREFIX = "EL_SENSOR";
      const BOOT_LINE_PREFIX = "EL_BOOT";
      const MIN_SENSOR_FIELD_COUNT = 6;
      const SENSOR_FIELDS = [
        { key: "elapsedMs", label: "Elapsed(ms)", summary: "elapsed" },
        { key: "accelerationX", label: "Accel X", summary: "ax" },
        { key: "accelerationY", label: "Accel Y", summary: "ay" },
        { key: "accelerationZ", label: "Accel Z", summary: "az" },
        { key: "lightLevel", label: "Light", summary: "light" },
        { key: "temperature", label: "Temp", summary: "temp" },
        { key: "buttonA", label: "Button A", summary: "btnA", flag: true },
        { key: "buttonB", label: "Button B", summary: "btnB", flag: true },
        {
          key: "logoTouch",
          label: "Logo Touch",
          summary: "logo",
          flag: true,
        },
        { key: "soundLevel", label: "Sound", summary: "sound" },
        { key: "compassHeading", label: "Compass", summary: "compass" },
      ];
      const CSV_HEADERS = [
        "at",
        "localDate",
        "timeZone",
        "sessionStartedAt",
        "sessionId",
        "type",
        "elapsedMs",
        "source",
        "sim",
        "files",
        "totalBlocks",
        "contentHash",
        "mainTs",
        "mainBlocks",
        "runId",
        "bootAt",
        "runningContentHash",
        "runAnchorSource",
        "blockChanges",
        ...SENSOR_FIELDS.filter((field) => field.key !== "elapsedMs").map(
          (field) => field.key,
        ),
        "detail",
      ];
      const extId = window.location.hash.slice(1);
      const pending = new Map();

      let requestSeq = 0;
      let events = loadEvents();
      let sessionId = "";
      let activeLogSessionId = latestSessionId(events);
      let sessionStartedAt = "";
      let activeRun = undefined;
      let logging = false;
      let pendingStop = false;
      let viewMode = "code";

      const statusEl = document.getElementById("status");
      const rowsEl = document.getElementById("rows");
      const emptyEl = document.getElementById("empty");
      const countEl = document.getElementById("count");
      const typesEl = document.getElementById("types");
      const blocksEl = document.getElementById("blocks");
      const lastChangeEl = document.getElementById("lastChange");
      const startEl = document.getElementById("start");
      const stopEl = document.getElementById("stop");
      const experimentStatusEl = document.getElementById("experimentStatus");
      const syncStatusEl = document.getElementById("syncStatus");
      const exportPanelEl = document.getElementById("exportPanel");
      const exportTitleEl = document.getElementById("exportTitle");
      const exportOutputEl = document.getElementById("exportOutput");
      const exportInfoEl = document.getElementById("exportInfo");
      const viewCodeEl = document.getElementById("viewCode");
      const viewSensorEl = document.getElementById("viewSensor");
      const tableHeadEl = document.getElementById("tableHead");

      function send(action, body, meta) {
        if (window.parent === window) {
          setStatus(
            "open this page from the MakeCode Edit Logger button",
            "error",
          );
          return false;
        }

        const id = `edit-logger-${++requestSeq}`;
        pending.set(id, { action, meta: meta || {} });
        window.parent.postMessage(
          {
            type: "pxtpkgext",
            extId,
            id,
            action,
            response: true,
            body,
          },
          "*",
        );
        return true;
      }

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = `status ${kind || ""}`.trim();
      }

      function loadEvents() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch {
          return [];
        }
      }

      let saveTimer = 0;

      function saveEvents() {
        if (!saveTimer)
          saveTimer = window.setTimeout(saveEventsNow, STORAGE_SAVE_DELAY_MS);
      }

      // The research API keeps the full history; the browser only keeps the
      // current logger session and anything the API has not acknowledged.
      function saveEventsNow() {
        clearTimeout(saveTimer);
        saveTimer = 0;
        events = events.filter(
          (event) =>
            event.sessionId === activeLogSessionId ||
            syncer.unsent.has(event.eventId),
        );
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        } catch {
          // Quota exceeded: the server copy (outbox) keeps working.
          setStatus("browser storage full; use server copy or export", "error");
        }
      }

      // Events not yet acknowledged by the local research API, by eventId.
      // Persisted so a reload or a stopped API never drops data.
      const syncer = {
        unsent: new Set(loadUnsent()),
        timer: 0,
        dueAt: 0,
        inFlight: false,
        lastError: "",

        add(event) {
          this.unsent.add(event.eventId);
          this.persist();
          this.schedule(
            event.type === "sensor" ? SYNC_SENSOR_DELAY_MS : SYNC_CODE_DELAY_MS,
          );
        },

        persist() {
          try {
            localStorage.setItem(OUTBOX_KEY, JSON.stringify([...this.unsent]));
          } catch {}
        },

        schedule(delayMs) {
          const dueAt = Date.now() + delayMs;
          if (this.timer && this.dueAt <= dueAt) return;
          clearTimeout(this.timer);
          this.dueAt = dueAt;
          this.timer = window.setTimeout(() => {
            this.timer = 0;
            this.flush();
          }, delayMs);
        },

        async flush() {
          if (this.inFlight || !this.unsent.size) return this.render();
          const batch = events
            .filter((event) => this.unsent.has(event.eventId))
            .slice(0, SYNC_BATCH_SIZE);
          if (!batch.length) {
            // The events were cleared locally; nothing left to send.
            this.unsent.clear();
            this.persist();
            return this.render();
          }

          this.inFlight = true;
          try {
            const response = await fetch(
              `${LOCAL_API_URL}/api/logger/events/batch`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ events: batch }),
              },
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            for (const event of batch) this.unsent.delete(event.eventId);
            this.persist();
            this.lastError = "";
          } catch (error) {
            this.lastError = error instanceof Error ? error.message : "error";
          } finally {
            this.inFlight = false;
            this.render();
            if (this.unsent.size) this.schedule(this.lastError ? 5000 : 200);
          }
        },

        render() {
          if (!this.unsent.size) {
            syncStatusEl.textContent = "サーバー保存: 最新";
            syncStatusEl.className = "status ok";
          } else {
            syncStatusEl.textContent = `サーバー未送信 ${this.unsent.size}件${this.lastError ? "（再試行中）" : ""}`;
            syncStatusEl.className = `status ${this.lastError ? "error" : ""}`.trim();
          }
        },
      };

      function loadUnsent() {
        try {
          return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function newEventId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      }

      function latestSessionId(items) {
        for (let index = items.length - 1; index >= 0; index--) {
          if (items[index].sessionId) return items[index].sessionId;
        }
        return "";
      }

      function activeSessionEvents() {
        if (!activeLogSessionId) return [];
        return events.filter((event) => event.sessionId === activeLogSessionId);
      }

      function createTimeFields() {
        const now = new Date();
        return {
          at: now.toISOString(),
          localDate: localDateString(now),
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
          sessionStartedAt,
        };
      }

      function localDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      const codeLogger = {
        watchTimer: 0,
        readInFlight: false,
        lastContentHash: latestCodeEvent() ? latestCodeEvent().contentHash : "",

        beginSession() {
          this.lastContentHash = "";
          this.stopWatch();
        },

        requestRead(reason) {
          if (this.readInFlight) return false;
          this.readInFlight = true;
          setStatus("reading user code");
          if (!send("extusercode", undefined, { reason })) {
            this.readInFlight = false;
            return false;
          }
          return true;
        },

        startWatch() {
          this.watchTimer = window.setInterval(
            () => this.requestRead("watch"),
            WATCH_INTERVAL_MS,
          );
        },

        stopWatch() {
          if (!this.watchTimer) return;
          clearInterval(this.watchTimer);
          this.watchTimer = 0;
        },

        finishRead() {
          this.readInFlight = false;
        },

        isReadInFlight() {
          return this.readInFlight;
        },

        handleUserCode(files, reason) {
          if (!logging && reason !== "stop" && !pendingStop) return;

          const eventType = reason === "start" ? "start" : "change";
          const event = createCodeEvent(eventType, files);

          if (reason === "start" || event.contentHash !== this.lastContentHash) {
            this.lastContentHash = event.contentHash;
            appendEvent(event);
            if (reason === "start") sensorLogger.beginSession();
            setStatus(`${event.type} saved at ${formatTime(event.at)}`, "ok");
          } else if (logging) {
            setStatus("logging; no changes");
          }

          if (reason === "stop" || pendingStop) finishStop();
        },
      };

      const sensorLogger = {
        streamRequested: false,
        buffer: "",
        lastKept: undefined,
        skipped: 0,

        keep(event) {
          const last = this.lastKept;
          const moved =
            !last ||
            ["accelerationX", "accelerationY", "accelerationZ"].some(
              (key) =>
                Math.abs((event[key] || 0) - (last[key] || 0)) >=
                SENSOR_MOVE_THRESHOLD_MG,
            );
          const input = ["buttonA", "buttonB", "logoTouch"].some(
            (key) => event[key] || (last && last[key]),
          );
          const heartbeat =
            last && Date.parse(event.at) - Date.parse(last.at) >= SENSOR_HEARTBEAT_MS;
          if (!moved && !input && !heartbeat) {
            this.skipped++;
            return false;
          }
          event.skippedSamples = this.skipped;
          this.skipped = 0;
          this.lastKept = event;
          return true;
        },

        resetSampling() {
          this.lastKept = undefined;
          this.skipped = 0;
        },

        beginSession() {
          this.resetSampling();
          this.buffer = "";
          this.streamRequested = false;
          this.requestStream();
        },

        reset() {
          this.buffer = "";
          this.streamRequested = false;
        },

        requestStream() {
          if (this.streamRequested) return;
          this.streamRequested = send(
            "extdatastream",
            { console: true, serial: true },
            { reason: "sensor" },
          );
        },

        handleStreamReady() {
          setStatus("sensor stream ready", "ok");
        },

        handleStreamFailure() {
          this.streamRequested = false;
        },

        handleConsoleData(body) {
          const data = typeof body === "string" ? body : body && body.data;
          if (!data) return;

          this.buffer += String(data);
          const lines = this.buffer.split(/\r?\n/);
          this.buffer = lines.pop() || "";

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith(`${BOOT_LINE_PREFIX},`)) {
              const bootEvent = this.parseBootLine(trimmed, body);
              if (bootEvent) {
                this.resetSampling();
                appendEvent(bootEvent);
              }
              continue;
            }

            const sensorEvent = this.parseLine(trimmed, body);
            if (sensorEvent && this.keep(sensorEvent)) appendEvent(sensorEvent);
          }
        },

        parseBootLine(line, body) {
          if (!logging || !sessionId || !line.startsWith(`${BOOT_LINE_PREFIX},`))
            return undefined;

          const parts = line.split(",");
          const elapsedMs = Number(parts[1]);
          if (!Number.isFinite(elapsedMs)) return undefined;
          if (activeRun && Date.now() - activeRun.bootMs < BOOT_MERGE_WINDOW_MS) {
            activeRun.bootMs = Date.now();
            return undefined;
          }

          return createBootEvent(elapsedMs, body);
        },

        parseLine(line, body) {
          if (
            !logging ||
            !sessionId ||
            !line.startsWith(`${SENSOR_LINE_PREFIX},`)
          )
            return undefined;

          const parts = line.split(",");
          if (parts.length < MIN_SENSOR_FIELD_COUNT + 1) return undefined;

          const values = {};
          for (let index = 0; index < SENSOR_FIELDS.length; index++) {
            const rawValue = parts[index + 1];
            if (rawValue === undefined || rawValue === "") {
              if (index < MIN_SENSOR_FIELD_COUNT) return undefined;
              values[SENSOR_FIELDS[index].key] = undefined;
              continue;
            }

            const value = Number(rawValue);
            if (!Number.isFinite(value)) return undefined;
            values[SENSOR_FIELDS[index].key] = value;
          }

          return createSensorEvent(values, body);
        },
      };

      function createCodeState(files) {
        const mainTs = files["main.ts"] || "";
        const mainBlocks = files["main.blocks"] || "";
        const blockTypes = countBlockTypes(mainBlocks);
        const blocks = parseBlocks(mainBlocks);

        return {
          files: Object.keys(files).sort(),
          contentHash: hashFiles(files),
          mainTs,
          mainBlocks,
          mainTsLength: mainTs.length,
          mainBlocksLength: mainBlocks.length,
          blockTypes,
          blocks,
          blockMap: mapBlocks(blocks),
          totalBlocks: Object.values(blockTypes).reduce(
            (sum, count) => sum + count,
            0,
          ),
        };
      }

      function countBlockTypes(blocksXml) {
        const counts = {};
        if (!blocksXml) return counts;

        const doc = new DOMParser().parseFromString(
          blocksXml,
          "application/xml",
        );
        for (const block of doc.querySelectorAll("block[type], shadow[type]")) {
          const type = block.getAttribute("type");
          counts[type] = (counts[type] || 0) + 1;
        }
        return counts;
      }

      function diffBlockTypes(previous, current) {
        const keys = new Set([
          ...Object.keys(previous),
          ...Object.keys(current),
        ]);
        const added = [];
        const removed = [];
        const changed = [];

        for (const key of keys) {
          const before = previous[key] || 0;
          const after = current[key] || 0;
          if (!before && after) added.push(`${key} +${after}`);
          else if (before && !after) removed.push(`${key} -${before}`);
          else if (before !== after)
            changed.push(
              `${key} ${after - before > 0 ? "+" : ""}${after - before}`,
            );
        }

        return { added, removed, changed };
      }

      function parseBlocks(blocksXml) {
        if (!blocksXml) return [];

        const doc = new DOMParser().parseFromString(
          blocksXml,
          "application/xml",
        );
        if (doc.querySelector("parsererror")) return [];

        return Array.from(doc.querySelectorAll("block[type], shadow[type]")).map(
          (block, index) => {
            const parentBlock = closestParentBlock(block);
            const topBlock = topLevelBlock(block);
            const parentEl = block.parentElement;
            const locationKind = parentEl
              ? parentEl.tagName.toLowerCase()
              : "";

            return {
              id: block.getAttribute("id") || `${block.getAttribute("type")}:${index}`,
              type: block.getAttribute("type") || "",
              kind: block.tagName.toLowerCase(),
              x: numberAttribute(block, "x"),
              y: numberAttribute(block, "y"),
              parentId: parentBlock ? parentBlock.getAttribute("id") || "" : "",
              parentType: parentBlock
                ? parentBlock.getAttribute("type") || ""
                : "",
              topId: topBlock ? topBlock.getAttribute("id") || "" : "",
              topType: topBlock ? topBlock.getAttribute("type") || "" : "",
              locationKind,
              inputName: parentEl ? parentEl.getAttribute("name") || "" : "",
              fields: directNamedChildren(block, "field"),
              inputs: directNamedChildren(block, "value"),
              statements: directNamedChildren(block, "statement"),
              mutation: directMutation(block),
            };
          },
        );
      }

      function mapBlocks(blocks) {
        const map = {};
        for (const block of blocks) map[block.id] = block;
        return map;
      }

      function closestParentBlock(block) {
        let current = block.parentElement;
        while (current) {
          if (
            current !== block &&
            (current.tagName.toLowerCase() === "block" ||
              current.tagName.toLowerCase() === "shadow") &&
            current.hasAttribute("type")
          )
            return current;
          current = current.parentElement;
        }
        return undefined;
      }

      function topLevelBlock(block) {
        let top = block;
        let current = closestParentBlock(block);
        while (current) {
          top = current;
          current = closestParentBlock(current);
        }
        return top;
      }

      function numberAttribute(el, name) {
        const raw = el.getAttribute(name);
        if (raw === null || raw === "") return undefined;
        const value = Number(raw);
        return Number.isFinite(value) ? value : undefined;
      }

      function directNamedChildren(block, tagName) {
        const values = {};
        for (const child of Array.from(block.children)) {
          if (child.tagName.toLowerCase() !== tagName) continue;
          const name = child.getAttribute("name");
          if (!name) continue;
          values[name] =
            tagName === "field"
              ? child.textContent || ""
              : firstChildBlockType(child);
        }
        return values;
      }

      function firstChildBlockType(parent) {
        for (const child of Array.from(parent.children)) {
          const tagName = child.tagName.toLowerCase();
          if (tagName === "block" || tagName === "shadow")
            return child.getAttribute("type") || "";
        }
        return "";
      }

      function directMutation(block) {
        for (const child of Array.from(block.children)) {
          if (child.tagName.toLowerCase() !== "mutation") continue;
          const mutation = {};
          for (const attribute of Array.from(child.attributes)) {
            mutation[attribute.name] = attribute.value;
          }
          return mutation;
        }
        return {};
      }

      let latestBlockMap = undefined;

      function blockMapOf(event) {
        if (!event) return {};
        if (event.blockMap) return event.blockMap;
        if (latestBlockMap && latestBlockMap.contentHash === event.contentHash)
          return latestBlockMap.blockMap;
        return mapBlocks(parseBlocks(event.mainBlocks || ""));
      }

      function diffBlocks(previous, current) {
        const previousMap = blockMapOf(previous);
        const currentMap = current.blockMap || {};
        const changes = [];

        for (const id of Object.keys(currentMap)) {
          if (!previousMap[id]) {
            changes.push(blockChange("added", undefined, currentMap[id]));
            continue;
          }

          const before = previousMap[id];
          const after = currentMap[id];
          if (blockLocationKey(before) !== blockLocationKey(after)) {
            changes.push(blockChange("moved", before, after));
          }
          if (blockContentKey(before) !== blockContentKey(after)) {
            changes.push(blockChange("changed", before, after));
          }
        }

        for (const id of Object.keys(previousMap)) {
          if (!currentMap[id]) changes.push(blockChange("removed", previousMap[id]));
        }

        return changes;
      }

      function blockChange(action, before, after) {
        const block = after || before;
        return {
          action,
          id: block.id,
          type: block.type,
          before: before ? blockChangeState(before) : undefined,
          after: after ? blockChangeState(after) : undefined,
        };
      }

      function blockChangeState(block) {
        return {
          x: block.x,
          y: block.y,
          parentId: block.parentId,
          parentType: block.parentType,
          topId: block.topId,
          topType: block.topType,
          locationKind: block.locationKind,
          inputName: block.inputName,
          fields: block.fields,
          inputs: block.inputs,
          statements: block.statements,
          mutation: block.mutation,
        };
      }

      function blockLocationKey(block) {
        return JSON.stringify({
          x: block.x,
          y: block.y,
          parentId: block.parentId,
          locationKind: block.locationKind,
          inputName: block.inputName,
        });
      }

      function blockContentKey(block) {
        return JSON.stringify({
          type: block.type,
          fields: block.fields,
          inputs: block.inputs,
          statements: block.statements,
          mutation: block.mutation,
        });
      }

      function currentCodeAnchor() {
        if (activeRun) {
          return {
            contentHash: activeRun.contentHash,
            runningContentHash: activeRun.contentHash,
            runAnchorSource: activeRun.anchorSource,
            runId: activeRun.runId,
            bootAt: activeRun.bootAt,
          };
        }

        const latest = latestCodeEventForSession() || latestCodeEvent();
        if (!latest) {
          return {
            contentHash: "",
            runningContentHash: "",
            runAnchorSource: "none",
          };
        }

        const anchorSource =
          latest.sessionId === sessionId ? "current-session" : "latest-known";
        return {
          contentHash: latest.contentHash || "",
          runningContentHash: latest.contentHash || "",
          runAnchorSource: anchorSource,
        };
      }

      function createSensorEvent(values, body) {
        const event = {
          type: "sensor",
          sessionId,
          ...createTimeFields(),
          ...currentCodeAnchor(),
          source: body.source || "",
          sim: !!body.sim,
        };

        for (const field of SENSOR_FIELDS) {
          event[field.key] = values[field.key];
        }

        return event;
      }

      function createBootEvent(elapsedMs, body) {
        const latest = latestCodeEventForSession() || latestCodeEvent();
        const eventTime = createTimeFields();
        const contentHash = latest ? latest.contentHash : "";
        const anchorSource =
          latest && latest.sessionId === sessionId
            ? "current-session"
            : latest
              ? "latest-known"
              : "none";
        const runId = `run-${Date.now().toString(36)}-${elapsedMs}`;

        activeRun = {
          runId,
          bootMs: Date.now(),
          bootAt: eventTime.at,
          contentHash,
          anchorSource,
        };

        return {
          type: "boot",
          sessionId,
          ...eventTime,
          source: (body && body.source) || "",
          sim: !!(body && body.sim),
          elapsedMs,
          contentHash,
          runId,
          bootAt: eventTime.at,
          runningContentHash: contentHash,
          runAnchorSource: anchorSource,
        };
      }

      function createCodeEvent(type, files) {
        const state = createCodeState(files);
        const previous = latestCodeEventForSession();
        const diff = diffBlockTypes(
          previous ? previous.blockTypes : {},
          state.blockTypes,
        );
        const blockChanges = type === "start" ? [] : diffBlocks(previous, state);
        // blocks/blockMap are derivable from mainBlocks and made up most of
        // the stored size, so only the latest snapshot keeps them in memory.
        const { blocks, blockMap, ...stored } = state;
        latestBlockMap = { contentHash: state.contentHash, blockMap };

        return {
          type,
          sessionId,
          ...createTimeFields(),
          ...stored,
          diff,
          blockChanges,
        };
      }

      function createSessionEvent(type) {
        return {
          type,
          sessionId,
          ...createTimeFields(),
          ...currentCodeAnchor(),
        };
      }

      // "running": the board runs the code most recently seen (since a boot).
      // "editing": the code has changed since the board last started.
      let phase = "editing";

      function appendEvent(event) {
        if (event.type === "boot") phase = "running";
        else if (event.type === "change") phase = "editing";
        event.phase = phase;
        event.eventId = newEventId();
        events.push(event);
        saveEvents();
        render();
        syncer.add(event);
      }

      function isCodeEvent(event) {
        return event.type === "start" || event.type === "change";
      }

      function latestCodeEvent() {
        for (let i = events.length - 1; i >= 0; i--) {
          if (isCodeEvent(events[i])) return events[i];
        }
        return undefined;
      }

      function latestCodeEventForSession() {
        for (let i = events.length - 1; i >= 0; i--) {
          if (events[i].sessionId === sessionId && isCodeEvent(events[i]))
            return events[i];
        }
        return undefined;
      }

      function latestCodeEventForActiveLog() {
        for (let i = events.length - 1; i >= 0; i--) {
          if (events[i].sessionId === activeLogSessionId && isCodeEvent(events[i]))
            return events[i];
        }
        return undefined;
      }

      function hashFiles(files) {
        const content = JSON.stringify(
          Object.keys(files)
            .sort()
            .map((key) => [key, files[key]]),
        );
        let hash = 5381;
        for (let i = 0; i < content.length; i++) {
          hash = ((hash << 5) + hash) ^ content.charCodeAt(i);
        }
        return (hash >>> 0).toString(16);
      }

      function summarizeDiff(diff) {
        const parts = [];
        if (diff.added.length) parts.push(`added: ${diff.added.join(", ")}`);
        if (diff.removed.length)
          parts.push(`removed: ${diff.removed.join(", ")}`);
        if (diff.changed.length)
          parts.push(`changed: ${diff.changed.join(", ")}`);
        return parts.join(" / ") || "no block type change";
      }

      function render() {
        const currentEvents = activeSessionEvents();
        const latest = latestCodeEventForActiveLog();
        countEl.textContent = String(currentEvents.length);
        typesEl.textContent = latest
          ? String(Object.keys(latest.blockTypes).length)
          : "0";
        blocksEl.textContent = latest ? String(latest.totalBlocks) : "0";
        lastChangeEl.textContent = latest
          ? summarizeShortDiff(latest.diff)
          : "-";

        const list = currentEvents.filter((event) =>
          viewMode === "sensor"
            ? event.type === "sensor" || event.type === "boot"
            : event.type !== "sensor" && event.type !== "boot",
        );

        tableHeadEl.innerHTML =
          viewMode === "sensor"
            ? sensorTableHead()
            : `<tr>
                <th>Time</th>
                <th>Event</th>
                <th>Blocks</th>
                <th>Change</th>
              </tr>`;

        rowsEl.innerHTML = "";
        emptyEl.hidden = list.length > 0;
        emptyEl.textContent =
          viewMode === "sensor" ? "No sensor events yet." : "No events yet.";

        for (const event of list.slice(-50).reverse()) {
          const row = document.createElement("tr");
          row.innerHTML =
            viewMode === "sensor"
              ? sensorTableRow(event)
              : `
                    <td>${escapeHtml(formatTime(event.at))}</td>
                    <td>${escapeHtml(event.type)}</td>
                    <td>${event.totalBlocks ?? "-"}</td>
                    <td>${escapeHtml(summarizeEvent(event))}</td>
                `;
          rowsEl.appendChild(row);
        }
      }

      function summarizeShortDiff(diff) {
        if (!diff) return "-";
        const count =
          diff.added.length + diff.removed.length + diff.changed.length;
        return count ? String(count) : "0";
      }

      function summarizeEvent(event) {
        if (event.type === "start") return "session started";
        if (event.type === "stop") return "session stopped";
        if (event.type === "boot") {
          return `device boot (sim=${event.sim ? "yes" : "no"}, code=${
            event.contentHash || "-"
          })`;
        }
        if (event.type === "sensor") {
          return SENSOR_FIELDS.filter((field) => field.key !== "elapsedMs")
            .map(
              (field) =>
                `${field.summary}=${formatSensorValue(event, field)}`,
            )
            .join(", ");
        }
        if (event.blockChanges && event.blockChanges.length) {
          return summarizeBlockChanges(event.blockChanges);
        }
        return summarizeDiff(event.diff);
      }

      function summarizeBlockChanges(changes) {
        return changes.slice(0, 8).map(summarizeBlockChange).join(" / ");
      }

      function summarizeBlockChange(change) {
        const state = change.after || change.before || {};
        const where = formatBlockLocation(state);
        if (change.action === "added")
          return `added ${change.type}${where ? ` at ${where}` : ""}`;
        if (change.action === "removed") return `removed ${change.type}`;
        if (change.action === "moved")
          return `moved ${change.type}${where ? ` to ${where}` : ""}`;
        return `changed ${change.type}${formatFieldSummary(change)}`;
      }

      function formatBlockLocation(state) {
        if (state.x !== undefined && state.y !== undefined)
          return `x=${state.x}, y=${state.y}`;
        if (state.parentType)
          return `${state.locationKind || "child"}:${state.inputName || "-"} in ${state.parentType}`;
        return "";
      }

      function formatFieldSummary(change) {
        const before = (change.before && change.before.fields) || {};
        const after = (change.after && change.after.fields) || {};
        const parts = [];
        for (const key of new Set([...Object.keys(before), ...Object.keys(after)])) {
          if (before[key] !== after[key])
            parts.push(`${key}: ${before[key] || "-"} -> ${after[key] || "-"}`);
        }
        return parts.length ? ` (${parts.join(", ")})` : "";
      }

      function formatTime(value) {
        return new Date(value).toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const exporter = {
        show(filename, content) {
          exportTitleEl.textContent = filename;
          exportOutputEl.value = content;
          exportPanelEl.hidden = false;
          exportOutputEl.focus();
          exportOutputEl.select();
          setStatus("export ready; copy text below", "ok");
          exportInfoEl.textContent = "copy export text";
        },

        json() {
          const items = activeSessionEvents();
          this.show(
            `makecode-edit-log${exportDateSuffix(items)}.json`,
            JSON.stringify(items, null, 2),
          );
        },

        csv() {
          const items = activeSessionEvents();
          const lines = [CSV_HEADERS.join(",")];
          for (const event of items) {
            lines.push(
              CSV_HEADERS.map((header) => this.csvCell(csvValue(event, header)))
                .join(","),
            );
          }
          this.show(
            `makecode-edit-log${exportDateSuffix(items)}.csv`,
            lines.join("\n"),
          );
        },

        csvCell(value) {
          return `"${String(value).replaceAll('"', '""')}"`;
        },
      };

      function exportDateSuffix(items) {
        const dates = Array.from(
          new Set(items.map((event) => event.localDate).filter(Boolean)),
        ).sort();
        if (!dates.length) return "";
        if (dates.length === 1) return `-${dates[0]}`;
        return `-${dates[0]}_${dates[dates.length - 1]}`;
      }

      function sensorTableHead() {
        return `<tr>
                <th>Time</th>
                ${SENSOR_FIELDS.map(
                  (field) => `<th>${escapeHtml(field.label)}</th>`,
                ).join("")}
              </tr>`;
      }

      function sensorTableRow(event) {
        return `
                    <td>${escapeHtml(formatTime(event.at))}</td>
                    ${SENSOR_FIELDS.map(
                      (field) =>
                        `<td>${escapeHtml(formatSensorValue(event, field))}</td>`,
                    ).join("")}
                `;
      }

      function formatSensorValue(event, field) {
        const value = event[field.key];
        if (value === undefined || value === null || value === "") return "-";
        if (field.flag) return value ? "true" : "false";
        return value;
      }

      function csvValue(event, header) {
        if (header === "files") return event.files ? event.files.join("|") : "";
        if (header === "detail") return summarizeEvent(event);
        if (header === "contentHash") return event.contentHash || "";
        if (header === "mainTs") return event.mainTs || "";
        if (header === "mainBlocks") return event.mainBlocks || "";
        if (header === "blockChanges")
          return event.blockChanges ? JSON.stringify(event.blockChanges) : "";
        return event[header] ?? "";
      }

      function startLogging() {
        if (logging) return;

        sessionId = `session-${Date.now().toString(36)}`;
        activeLogSessionId = sessionId;
        sessionStartedAt = new Date().toISOString();
        activeRun = undefined;
        phase = "editing";
        logging = true;
        pendingStop = false;
        startEl.disabled = true;
        stopEl.disabled = false;
        codeLogger.beginSession();
        if (!codeLogger.requestRead("start")) {
          resetLoggingState();
          return;
        }
        codeLogger.startWatch();
        setStatus("logging started", "ok");
      }

      function stopLogging(captureFinalRead = true) {
        if (!logging && !pendingStop) return;

        logging = false;
        pendingStop = true;
        startEl.disabled = false;
        stopEl.disabled = true;
        codeLogger.stopWatch();

        if (!captureFinalRead) {
          finishStop();
          return;
        }

        if (codeLogger.isReadInFlight()) {
          setStatus("stopping after current read");
          return;
        }

        if (!codeLogger.requestRead("stop")) {
          finishStop();
        }
      }

      function resetLoggingState() {
        logging = false;
        pendingStop = false;
        sessionId = "";
        startEl.disabled = false;
        stopEl.disabled = true;
        codeLogger.stopWatch();
        sensorLogger.reset();
      }

      function finishStop() {
        if (!pendingStop || !sessionId) return;

        appendEvent(createSessionEvent("stop"));
        pendingStop = false;
        setStatus("logging stopped", "ok");
        experimentWatcher.afterStop();
      }

      window.addEventListener("message", (ev) => {
        const msg = ev.data || {};
        if (msg.type !== "pxtpkgext") return;

        if (msg.event === "extconsole") {
          sensorLogger.handleConsoleData(msg.body);
          return;
        }

        if (msg.id && pending.has(msg.id)) {
          const { action, meta } = pending.get(msg.id);
          pending.delete(msg.id);

          if (action === "extusercode") codeLogger.finishRead();

          if (!msg.success) {
            setStatus(
              `${action} failed: ${msg.error || "unknown error"}`,
              "error",
            );
            if (
              action === "extusercode" &&
              (meta.reason === "stop" || pendingStop)
            )
              finishStop();
            if (action === "extusercode" && meta.reason === "start")
              resetLoggingState();
            if (action === "extdatastream") sensorLogger.handleStreamFailure();
            return;
          }

          if (action === "extusercode") {
            codeLogger.handleUserCode(msg.resp || {}, meta.reason);
          } else if (action === "extdatastream") {
            sensorLogger.handleStreamReady();
          } else if (action === "extinit") {
            setStatus("ready", "ok");
          }
        }
      });

      function setViewMode(mode) {
        viewMode = mode;
        viewCodeEl.classList.toggle("primary", mode === "code");
        viewSensorEl.classList.toggle("primary", mode === "sensor");
        render();
      }

      viewCodeEl.addEventListener("click", () => setViewMode("code"));
      viewSensorEl.addEventListener("click", () => setViewMode("sensor"));

      // Follows the experiment started on the problem site: logging starts
      // and stops with it, so participants never have to press Start.
      const experimentWatcher = {
        current: null,
        autoLogging: false,
        manualStopSessionId: "",
        restartAfterStop: false,

        async poll() {
          try {
            // Report our own state so the problem site can warn when logging is off.
            const query = new URLSearchParams({
              logging: String(logging),
              logger_session_id: sessionId,
              unsent: String(syncer.unsent.size),
            });
            const response = await fetch(
              `${LOCAL_API_URL}/api/experiment/current?${query}`,
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            this.update((await response.json()).session);
          } catch {
            experimentStatusEl.textContent = "実験サーバーに接続できません（ブラウザ内に保存中）";
            experimentStatusEl.className = "status error";
          }
        },

        update(session) {
          const previousId = this.current && this.current.session_id;
          this.current = session;
          if (!session) {
            experimentStatusEl.textContent = logging
              ? "実験未開始（記録は保存されますが実験に紐付きません）"
              : "実験未開始：問題サイトで「開始」を押すと自動で記録します";
            experimentStatusEl.className = "status";
            if (this.autoLogging && logging) stopLogging();
            return;
          }

          if (window.parent !== window && !logging && !pendingStop) {
            if (this.manualStopSessionId !== session.session_id) {
              this.autoLogging = true;
              startLogging();
              window.setTimeout(() => this.poll(), 1000);
            }
          } else if (previousId && previousId !== session.session_id && this.autoLogging && logging) {
            this.restartAfterStop = true;
            stopLogging();
          }
          experimentStatusEl.textContent = logging
            ? `実験 ${session.participant_id} に記録中`
            : `実験 ${session.participant_id}：停止中（Startで再開）`;
          experimentStatusEl.className = `status ${logging ? "ok" : "error"}`;
        },

        afterStop() {
          if (!this.restartAfterStop) return;
          this.restartAfterStop = false;
          if (this.current) startLogging();
        },
      };

      startEl.addEventListener("click", startLogging);
      stopEl.addEventListener("click", () => {
        // A manual stop opts out of automatic restarts for this experiment.
        experimentWatcher.autoLogging = false;
        experimentWatcher.manualStopSessionId =
          (experimentWatcher.current && experimentWatcher.current.session_id) || "";
        stopLogging();
      });
      document
        .getElementById("exportJson")
        .addEventListener("click", () => exporter.json());
      document
        .getElementById("exportCsv")
        .addEventListener("click", () => exporter.csv());
      document.getElementById("closeExport").addEventListener("click", () => {
        exportPanelEl.hidden = true;
      });
      document
        .getElementById("copyExport")
        .addEventListener("click", async () => {
          exportOutputEl.focus();
          exportOutputEl.select();

          try {
            await navigator.clipboard.writeText(exportOutputEl.value);
            setStatus("export copied", "ok");
            exportInfoEl.textContent = "copied";
          } catch {
            document.execCommand("copy");
            setStatus("export selected; press Cmd+C if copy did not run", "ok");
            exportInfoEl.textContent = "selected";
          }
        });
      document.getElementById("clear").addEventListener("click", () => {
        if (
          syncer.unsent.size &&
          !confirm(`サーバー未送信のイベントが${syncer.unsent.size}件あります。消去しますか？`)
        )
          return;
        events = [];
        activeLogSessionId = "";
        saveEventsNow();
        render();
        setStatus("logs cleared");
      });

      window.addEventListener("pagehide", () => {
        stopLogging(false);
        saveEventsNow();
      });

      window.addEventListener("load", () => {
        render();
        syncer.render();
        syncer.schedule(0);
        experimentWatcher.poll();
        window.setInterval(() => experimentWatcher.poll(), EXPERIMENT_POLL_MS);
        if (window.parent === window) {
          setStatus(
            "UI preview only. Open from MakeCode to capture edit events.",
            "error",
          );
        } else {
          send("extinit", "");
        }
      });
    </script>
  </body>
</html>
